name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  # ── Bash unit + integration test suite ──────────────────────────────────
  bash-tests:
    name: Bash tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install jq (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Run bash test suite
        run: bash tests/run-tests

  # ── Python package — build, install, pytest ──────────────────────────────
  python-package:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
        include:
          # Smoke-test on macOS with the latest Python only.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jq (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y jq

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        run: brew install jq

      - name: Build wheel
        run: |
          pip install build hatchling
          python -m build --wheel

      - name: Install wheel and run tests
        # Install the just-built wheel into the current environment, then tell
        # the conftest where the binary is so it skips redundant wheel rebuild.
        run: |
          pip install pytest dist/slopguard-*.whl
          SLOPGUARD_TEST_BIN="$(python -c 'import shutil; print(shutil.which("slopguard"))')" \
            pytest tests/python/ -v

  # ── Verify wheel contains expected plugin data ───────────────────────────
  wheel-contents:
    name: Wheel contents check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build hatchling
          python -m build --wheel

      - name: Check wheel contains plugin data
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile
          wheel = next(pathlib.Path("dist").glob("slopguard-*.whl"))
          with zipfile.ZipFile(wheel) as zf:
              names = set(zf.namelist())
          required = [
              "slopguard/_plugin/bin/slopguard",
              "slopguard/_plugin/lib/deps.sh",
              "slopguard/_plugin/hooks/hooks.json",
              "slopguard/_plugin/rules/catalog.yaml",
              "slopguard/_plugin/.claude-plugin/plugin.json",
              "slopguard/_cli.py",
          ]
          missing = [p for p in required if p not in names]
          if missing:
              print("MISSING from wheel:", *missing, sep="\n  ")
              sys.exit(1)
          print(f"OK — wheel has {len(names)} entries, all required files present.")
          PY
