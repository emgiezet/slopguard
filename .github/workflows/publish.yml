name: Publish to PyPI

# Triggered by a version tag push (e.g. v0.7.0).
# Uses PyPI Trusted Publishing (OIDC) — no API token or secret required.
#
# Pre-requisites (owner actions, not automated):
#   1. Create a GitHub release environment named "pypi-publish" in repo Settings →
#      Environments.  Add a deployment protection rule (require review) if desired.
#   2. On PyPI, go to the project's "Publishing" tab and add a Trusted Publisher
#      entry:
#        Owner:       <your-github-org-or-user>
#        Repository:  slop-guard        (this repo's name)
#        Workflow:    publish.yml
#        Environment: pypi-publish
#   The workflow then publishes without any stored secret.

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read
  id-token: write   # Required for Trusted Publishing OIDC token exchange

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for accurate metadata

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build hatchling

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify version tag matches pyproject.toml
        # Guard against accidentally publishing a stale version.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYVER="$(python -c "
          import tomllib, pathlib
          with open('pyproject.toml','rb') as f:
              data = tomllib.load(f)
          print(data['project']['version'])
          ")"
          if [ "$TAG" != "$PYVER" ]; then
            echo "ERROR: tag v${TAG} != pyproject.toml version ${PYVER}"
            exit 1
          fi
          echo "OK: version ${PYVER} matches tag"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-publish   # matches the Trusted Publisher environment name

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password= or token= required — OIDC Trusted Publishing handles auth.
        with:
          print-hash: true
