---
# rules/mapping/opengrep.yaml — Opengrep rule ID → AP-id mapping.
# Severity defaults: security with CWE Top-25 → blocker, other security → error,
# performance → warn, maintainability → warn.
# Tier 2 AP-JVM-*/AP-CS-*/AP-RB-*/AP-RS-* IDs are provisional; catalog
# entries will be confirmed in Etap 5.
rules:
  # ---------- PHP / Laravel ----------
  slopguard.php.laravel.raw-sql-interpolation:
    ap_id: AP-PHP-SEC-001
    severity: blocker
    category: security
    cwe: CWE-89
  slopguard.php.laravel.blade-unescaped-output:
    ap_id: AP-PHP-SEC-004
    severity: blocker
    category: security
    cwe: CWE-79
  slopguard.php.laravel.mass-assignment-request-all:
    ap_id: AP-PHP-SEC-005
    severity: error
    category: security
    cwe: CWE-915
  slopguard.php.laravel.query-in-loop:
    ap_id: AP-PHP-PERF-003
    severity: error
    category: performance
    cwe: ""
  slopguard.php.laravel.unbounded-all:
    ap_id: AP-PHP-PERF-002
    severity: warn
    category: performance
    cwe: ""
  slopguard.php.weak-password-hash:
    ap_id: AP-PHP-SEC-006
    severity: blocker
    category: security
    cwe: CWE-327
  slopguard.php.insecure-random-token:
    ap_id: AP-PHP-SEC-006
    severity: error
    category: security
    cwe: CWE-330
  # ---------- Go ----------
  slopguard.go.http-client-without-timeout:
    ap_id: AP-GO-PERF-001
    severity: error
    category: performance
    cwe: CWE-400
  slopguard.go.goroutine-per-item-unbounded:
    ap_id: AP-GO-PERF-003
    severity: error
    category: performance
    cwe: CWE-400
  # ---------- Python ----------
