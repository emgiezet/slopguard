[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisdlc-guard"
version = "0.6.0"
description = "Anti-pattern detection and gate for agent-written code"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["security", "sast", "linting", "anti-patterns", "supply-chain", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]

# Runtime: pure Python wrapper; bash + jq are runtime requirements documented in README.
dependencies = []

[project.scripts]
slopguard = "slopguard._cli:main"

[project.urls]
Repository = "https://github.com/emgiezet/slopguard"
Issues = "https://github.com/emgiezet/slopguard/issues"

# ---------------------------------------------------------------------------
# Hatchling — wheel build
# ---------------------------------------------------------------------------
# The wheel packages the Python wrapper from src/ plus the entire Bash plugin
# tree (bin/, lib/, hooks/, rules/, configs/, skills/, tools/, agents/,
# extensions/) bundled under slopguard/_plugin/ via force-include.  This keeps
# the source layout intact (plugin users reference bin/slopguard directly) while
# giving pip-installed users a self-contained package whose entry-point auto-
# discovers the bundled root.
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/slopguard"]

[tool.hatch.build.targets.wheel.force-include]
"bin"             = "slopguard/_plugin/bin"
"lib"             = "slopguard/_plugin/lib"
"hooks"           = "slopguard/_plugin/hooks"
"rules"           = "slopguard/_plugin/rules"
"configs"         = "slopguard/_plugin/configs"
"skills"          = "slopguard/_plugin/skills"
"tools"           = "slopguard/_plugin/tools"
"agents"          = "slopguard/_plugin/agents"
"extensions"      = "slopguard/_plugin/extensions"
"package.json"    = "slopguard/_plugin/package.json"
"plugin.json"     = "slopguard/_plugin/plugin.json"
".claude-plugin"  = "slopguard/_plugin/.claude-plugin"

# ---------------------------------------------------------------------------
# Hatchling — sdist build
# ---------------------------------------------------------------------------
# sdist preserves the original plugin layout so recipients can build the wheel
# or use bin/slopguard directly after extraction.

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "bin/",
  "lib/",
  "hooks/",
  "rules/",
  "configs/",
  "skills/",
  "tools/",
  "agents/",
  "extensions/",
  "tests/",
  "docs/",
  "package.json",
  "plugin.json",
  ".claude-plugin/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "THIRD_PARTY_NOTICES.md",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests/python"]
